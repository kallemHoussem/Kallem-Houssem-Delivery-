<style>
:root{box-sizing:border-box;--bg1:#0a2a6b;--bg2:#1e90ff;--card:rgba(255,255,255,.14);--acc:#5fd0ff;--wa:#25d366;--orange:#e8873a;--field:#fff;--ft:#0a2a6b;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#061a45;--bg2:#0b5ed7}}
:root[data-theme="dark"]{--bg1:#061a45;--bg2:#0b5ed7}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;min-height:100vh;background:linear-gradient(170deg,var(--bg2),var(--bg1)) fixed;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:480px;padding:18px 16px 100px}
.tb{display:flex;align-items:center;gap:10px;margin:0 0 16px}
.tb svg{width:38px;height:38px;flex:none}
.lt{line-height:1.05;text-align:left}
.lar{font-family:Cairo,"Segoe UI",Tahoma,sans-serif;font-weight:800;font-size:1.25rem}
.len{font-size:.62rem;letter-spacing:2.2px;font-weight:700;color:var(--acc);margin-top:2px}
.hi{font-size:1.15rem;font-weight:700;margin:4px 0 14px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:block;background:var(--card);color:#fff;text-decoration:none;border:0;border-radius:20px;padding:20px 8px;text-align:center;font:inherit;font-weight:700;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.2)}
.tile span{display:grid;place-items:center;width:64px;height:64px;margin:0 auto 8px;border-radius:18px;background:var(--orange);font-size:2rem}
.tile.b span{background:#1e90ff}.tile.g span{background:#1faa59}.tile.p span{background:#8a63d2}
.tile small{display:block;font-weight:500;opacity:.8;margin-top:2px}
.call{display:block;text-align:center;color:#fff;margin-top:20px;opacity:.9}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.back{background:var(--card);border:0;color:#fff;border-radius:12px;padding:10px 14px;font-size:1.1rem;cursor:pointer}
.top h2{margin:0;font-size:1.2rem}
input,textarea{width:100%;padding:12px;border-radius:12px;border:0;font:inherit;background:var(--field);color:var(--ft)}
textarea{min-height:64px;resize:vertical}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0}
.chip{flex:none;background:var(--card);color:#fff;border:0;border-radius:20px;padding:8px 14px;font-weight:600;cursor:pointer;font:inherit}
.chip.on{background:#fff;color:var(--ft)}
.rg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rest{background:var(--card);border-radius:18px;padding:14px 8px;text-align:center;cursor:pointer}
.cover{width:76px;height:76px;margin:0 auto 8px;border-radius:50%;background:var(--orange);display:grid;place-items:center;font-size:2.3rem}
.rest b{display:block}
.rest small{opacity:.85}
.open{color:#7dffa6;font-weight:700}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border-radius:14px;padding:12px;margin-bottom:8px}
.item b{display:block}
.price{color:var(--acc);font-weight:700}
.price.u{font-weight:500;font-size:.8rem;opacity:.85}
.qty{display:flex;align-items:center;gap:10px;flex:none}
.qty button{width:34px;height:34px;border-radius:50%;border:0;font-size:1.2rem;font-weight:700;cursor:pointer;background:#fff;color:var(--ft)}
.qty .add{background:var(--wa);color:#fff}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pc{background:var(--card);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:4px;text-align:center}
.ph{height:84px;border-radius:12px;background:rgba(255,255,255,.12);display:grid;place-items:center;font-size:2.8rem;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.pc .qty{justify-content:center;margin-top:4px}
.hq{margin-bottom:6px}
.t3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.t3 .tile{padding:14px 4px;font-size:.82rem;border-radius:16px}
.t3 .tile span{width:50px;height:50px;font-size:1.6rem;border-radius:14px;margin-bottom:6px}
.tile.c0 span{background:var(--orange)}.tile.c1 span{background:#1e90ff}.tile.c2 span{background:#1faa59}.tile.c3 span{background:#8a63d2}
.again{display:block;width:100%;margin-top:14px;padding:14px;border:0;border-radius:14px;background:var(--card);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.sr{display:block;font-size:.75rem;opacity:.75}
.send{display:block;width:100%;margin:12px 0;padding:16px;border:0;border-radius:16px;background:var(--wa);color:#fff;font:inherit;font-size:1.05rem;font-weight:700;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.nv{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:0;background:rgba(6,26,69,.94);backdrop-filter:blur(10px);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
.nv button{position:relative;flex:1;max-width:160px;background:none;border:0;color:#fff;opacity:.65;font:inherit;font-size:1.4rem;padding:4px 0;cursor:pointer}
.nv button.on{opacity:1}
.nv small{display:block;font-size:.68rem;font-weight:600}
.nv i{position:absolute;top:0;right:28%;background:var(--wa);color:#fff;border-radius:10px;font-style:normal;font-size:.7rem;font-weight:700;padding:1px 6px}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.bar button{pointer-events:auto;width:100%;max-width:448px;display:flex;justify-content:space-between;background:var(--wa);color:#fff;border:0;border-radius:16px;padding:16px;font-size:1.05rem;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.35);cursor:pointer;font-family:inherit}
.box{background:var(--card);border-radius:16px;padding:14px;margin:12px 0;display:grid;gap:8px}
.box label{font-size:.85rem;font-weight:600}
.tot{display:flex;justify-content:space-between;font-weight:700;font-size:1.1rem}
.note{font-size:.85rem;opacity:.85;text-align:center;margin:8px 0}
.empty{text-align:center;opacity:.85;padding:30px 0}
</style>
</head>

}
function restos(){
  var rs=R.filter(function(r){return r.cat;}),cats=['Tous'];
  rs.forEach(function(r){if(cats.indexOf(r.cat)<0)cats.push(r.cat);});
  var l=rs.filter(function(r){return (cat==='Tous'||r.cat===cat)&&r.name.toLowerCase().indexOf(q.toLowerCase())>=0;});
  return back('home')+'<h2>🍴 Restaurants</h2></div><input id="q" placeholder="🔍 Chercher un restaurant…" value="'+esc(q)+'">'+chips(cats,cat,'data-c')+
   (l.length?'<div class="rg">'+l.map(function(r){return'<div class="rest" data-r="'+r.id+'"><div class="cover">'+r.emoji+'</div><b>'+esc(r.name)+'</b><small>'+esc(r.cat)+' · <span class="open">Ouvert</span></small></div>';}).join('')+'</div>':'<div class="empty">Aucun restaurant trouvé</div>');
}
function menu(){
  var r=src(vr),h=back('restos')+'<h2>'+r.emoji+' '+esc(r.name)+'</h2></div>';
  r.items.forEach(function(it,i){h+=itemH(r,i);});return h;
}
function pcard(r,i){
  var it=r.items[i],n=cart[r.id+'|'+i]||0;
  return'<div class="pc"><div class="ph">'+(it.img?'<img src="'+it.img+'" alt="">':it.e)+'</div><b>'+esc(it.n)+(it.a?' 🔞':'')+'</b>'+(it.p==null?'<span class="price u">prix en magasin</span>':'<span class="price">'+fmt(it.p)+'</span>')+'<div class="qty">'+
   (n?'<button data-m="'+r.id+'|'+i+'">−</button><b>'+n+'</b>':'')+'<button class="add" data-p="'+r.id+'|'+i+'">+</button></div></div>';
}
function shop(r,cs,cv,note){
  var h=back('home')+'<h2>'+r.emoji+' '+esc(r.lab)+'</h2></div>';
  h+='<div class="chips"><button class="chip'+(cv==='Tous'?' on':'')+'" data-mc="Tous">Tout</button>'+cs.map(function(c){return'<button class="chip'+(cv===c[0]?' on':'')+'" data-mc="'+esc(c[0])+'">'+c[1]+' '+esc(c[0])+'</button>';}).join('')+'</div><div class="pg">';
  r.items.forEach(function(it,i){if(cv==='Tous'||it.c===cv)h+=pcard(r,i);});
  return h+'</div><p class="note">'+note+'</p>';
}
function colis(){
  return back('home')+'<h2>📦 Colis</h2></div><div class="box">'+
   '<label>Adresse de départ (où récupérer)</label><input id="c1" value="'+esc(info.adr)+'">'+
   '<label>Adresse d’arrivée (où livrer)</label><input id="c2">'+
   '<label>Nom et téléphone du destinataire</label><input id="c3">'+
   '<label>Description du colis</label><textarea id="c4"></textarea></div>'+
   '<button class="send" onclick="sendColis()">Envoyer sur WhatsApp 📲</button>';
}
function sendColis(){
  var v=function(i){return document.getElementById(i).value.trim();};
  var m='Bonjour Kallem Houssem 👋\nDemande de livraison de colis 📦\n🅰️ Départ : '+v('c1')+'\n🅱️ Arrivée : '+v('c2')+'\n👤 Destinataire : '+v('c3')+'\n📝 Colis : '+v('c4')+'\n📍 Je vous envoie ma position.';
  window.open(wa(m),'_blank');
}
function cartV(){
  var ks=Object.keys(cart),h=back('home')+'<h2>🛒 Mon panier</h2></div>';
  if(!ks.length)return h+'<div class="empty" style="font-size:3rem">🛒</div><div class="empty" style="padding-top:0">Votre panier est vide</div><button class="send" data-g="home">Commencer mes achats</button>';
  var ids=[];ks.forEach(function(k){var i=k.split('|')[0];if(ids.indexOf(i)<0)ids.push(i);});
  ids.forEach(function(id){var r=src(id);
    h+='<div class="note" style="text-align:left;font-weight:700;margin-top:14px">'+esc(lab(r))+'</div>';
    ks.forEach(function(k){var p=k.split('|');if(p[0]===id){var it=r.items[p[1]];
      h+='<div class="item"><div><b>'+(it.e?it.e+' ':'')+esc(it.n)+'</b>'+(it.p==null?'<span class="price u">prix en magasin</span>':'<span class="price">'+fmt(it.p*cart[k])+'</span>')+'</div><div class="qty"><button data-m="'+k+'">−</button><b>'+cart[k]+'</b><button class="add" data-p="'+k+'">+</button></div></div>';}});
  });
  var s=total();
  if(s.t||!s.u)h+='<div class="tot"><span>Total articles</span><span>'+fmt(s.t)+(s.u?' +':'')+'</span></div>';
  h+='<p class="note">'+(s.u?'Produits payés au prix du magasin. ':'')+(ids.length>1?'Plusieurs commerces : ':'')+'frais de livraison confirmés par WhatsApp.</p>';
  h+='<div class="box"><label>Votre nom</label><input id="nom" value="'+esc(info.nom)+'" autocomplete="name"><label>Adresse / repère</label><input id="adr" value="'+esc(info.adr)+'" autocomplete="street-address"><label>Remarque (optionnel)</label><textarea id="rem"></textarea></div>';
  return h+'<button class="send" onclick="send()">Commander sur WhatsApp 📲</button>';
}
function send(){
  var n=document.getElementById('nom').value.trim(),a=document.getElementById('adr').value.trim(),rem=document.getElementById('rem').value.trim();
  info={nom:n,adr:a};try{localStorage.setItem('kh_info',JSON.stringify(info));localStorage.setItem('kh_last2',JSON.stringify(cart));}catch(e){}
  var ks=Object.keys(cart),ids=[],m='Bonjour Kallem Houssem 👋\nNouvelle commande :\n',adult=false;
  ks.forEach(function(k){var i=k.split('|')[0];if(ids.indexOf(i)<0)ids.push(i);});
  ids.forEach(function(id){var r=src(id);m+='\n'+lab(r)+'\n';
    ks.forEach(function(k){var p=k.split('|');if(p[0]===id){var it=r.items[p[1]];if(it.a)adult=true;m+='• '+cart[k]+'× '+it.n+(it.p==null?'':' ('+fmt(it.p*cart[k])+')')+'\n';}});});
  var s=total();m+='\n';
  if(s.t)m+='💰 Total articles : '+fmt(s.t)+(s.u?' + produits au prix du magasin':'')+'\n';else if(s.u)m+='💰 Produits au prix du magasin\n';
  if(adult)m+='🔞 Client majeur (+18) – pièce d’identité possible à la livraison\n';
  if(n)m+='👤 '+n+'\n';if(a)m+='🏠 '+a+'\n';if(rem)m+='📝 '+rem+'\n';
  window.open(wa(m+'📍 Je vous envoie ma position.'),'_blank');
}
function render(keep){
  var y=window.scrollY,h;
  if(view==='home')h=home();else if(view==='restos')h=restos();else if(view==='resto')h=menu();
  else if(view==='market')h=shop(MK,CATS,mc,'Un produit n’est pas dans la liste ? Écrivez-le dans la remarque du panier.');else if(view==='kiosk')h=shop(KS,KCATS,kc,'Tickets et tabac : précisez le montant ou la marque dans la remarque du panier.');else if(view==='colis')h=colis();else if(view==='search')h=search();else h=cartV();
  app.innerHTML=TOP+h+nav();if(keep)window.scrollTo(0,y);
}
app.addEventListener('click',function(e){
  var t=e.target.closest('[data-r],[data-c],[data-p],[data-m],[data-g],[data-mc],[data-sq]');if(!t)return;var d=t.dataset;
  if(d.g){
    if(d.g.indexOf('mcat:')===0){mc=d.g.slice(5);go('market');return;}
    if(d.g==='market'){mc='Tous';go('market');return;}
    if(d.g==='kiosk'){kc='Tous';go('kiosk');return;}
    if(d.g==='again'){try{var l=JSON.parse(localStorage.getItem('kh_last2')||'{}');cart={};Object.keys(l).forEach(function(k){var p=k.split('|'),r=src(p[0]);if(r&&r.items[p[1]])cart[k]=l[k];});}catch(x){}go('cart');return;}
    go(d.g);return;}
  if(d.r){go('resto',d.r);return;}
  if(d.c){cat=d.c;render();return;}
    if(d.mc){if(view==='kiosk')kc=d.mc;else mc=d.mc;render(true);return;}
  if(d.sq){sq=d.sq;render();var f=document.getElementById('sq');if(f)f.focus();return;}
  var k=(d.p||d.m).split('|');chg(k[0],+k[1],d.p?1:-1);
});
app.addEventListener('input',function(e){
  var id=e.target.id;if(id!=='q'&&id!=='sq')return;
  if(id==='q')q=e.target.value;else sq=e.target.value;
  var p=e.target.selectionStart;render();var el=document.getElementById(id);el.focus();el.setSelectionRange(p,p);
});
render();
</script>
</body>
</html>
