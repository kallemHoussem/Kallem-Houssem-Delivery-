<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Jibli read-only checks</title>
  <style>
    body{max-width:42rem;margin:2rem auto;padding:0 1rem;font:16px system-ui,sans-serif;color:#102447}
    li{margin:.7rem 0}.ok{color:#137333}.fail{color:#b3261e}
  </style>
</head>
<body>
  <h1>Jibli read-only checks</h1>
  <p>These checks only read the app shell. They do not sign in, create orders, or write to Firebase.</p>
  <ul id="results"><li>Checking files…</li></ul>
  <script>
    (async function(){
      const files=['./index.html','./livreur.html','./gestion.html','./service-worker.js','./manifest.webmanifest'];
      const results=document.getElementById('results');
      results.replaceChildren();
      for(const file of files){
        const row=document.createElement('li');
        try{
          const response=await fetch(file,{cache:'no-store'});
          if(!response.ok)throw new Error('HTTP '+response.status);
          if(file.endsWith('.webmanifest'))await response.json();
          row.className='ok';row.textContent='OK · '+file;
        }catch(error){row.className='fail';row.textContent='Failed · '+file+' · '+error.message;}
        results.append(row);
      }
      const source=await fetch('./index.html',{cache:'no-store'}).then(r=>r.text()).catch(()=> '');
      const row=document.createElement('li');
      if(source.includes("projectId:'kallem-houssem-gestion'")||source.includes('projectId:"kallem-houssem-gestion"')){
        row.className='ok';row.textContent='OK · storefront points to the expected Firebase project';
      }else{
        row.className='fail';row.textContent='Failed · storefront Firebase project ID was not found';
      }
      results.append(row);
    })();
  </script>
</body>
</html>
